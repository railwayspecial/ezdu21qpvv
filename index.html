<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>.</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background:#1b1b1b; color:#eee; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; }
  button { font-size:20px; padding:20px 40px; border-radius:10px; border:none; background:#4caf50; color:#fff; cursor:pointer; }
  button:active { background:#3d8b40; }
  #status { font-size:14px; color:#888; margin-top:16px; height:20px; }
</style>
</head>
<body>
<button id="btn">Copy</button>
<div id="status"></div>

<script>
const CHARS = "23456789BCDFGHJKMNPQRTVWXY";
const statusEl = document.getElementById('status');

function getSecret() {
  const m = location.hash.match(/secret=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}

function b64decode(str) {
  const bin = atob(str.trim());
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

async function generateCode(sharedSecret, timestamp) {
  const keyBytes = b64decode(sharedSecret);
  const key = await crypto.subtle.importKey('raw', keyBytes, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
  const t = Math.floor(timestamp / 30);
  const msg = new Uint8Array(8);
  const view = new DataView(msg.buffer);
  view.setUint32(0, Math.floor(t / 0x100000000));
  view.setUint32(4, t >>> 0);
  const sig = new Uint8Array(await crypto.subtle.sign('HMAC', key, msg));
  const offset = sig[19] & 0x0f;
  let codeInt = ((sig[offset] & 0x7f) << 24) | (sig[offset + 1] << 16) | (sig[offset + 2] << 8) | sig[offset + 3];
  codeInt = codeInt >>> 0;
  let code = '';
  for (let i = 0; i < 5; i++) {
    code += CHARS[codeInt % CHARS.length];
    codeInt = Math.floor(codeInt / CHARS.length);
  }
  return code;
}

document.getElementById('btn').addEventListener('click', async () => {
  const secret = getSecret();
  if (!secret) { statusEl.textContent = 'нет секрета'; return; }
  try {
    const code = await generateCode(secret, Date.now() / 1000);
    await navigator.clipboard.writeText(code);
    statusEl.textContent = 'скопировано';
    setTimeout(() => { statusEl.textContent = ''; }, 1500);
  } catch (e) {
    statusEl.textContent = 'ошибка';
  }
});
</script>
</body>
</html>
